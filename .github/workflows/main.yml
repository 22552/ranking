name: Ranking Bot

on:
  schedule:
    - cron: "0 */4 * * *"   # 4時間ごと（UTC）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run bot
        run: node bot.js

      - name: Commit and Push
        run: |
          git config user.name "ranking-bot"
          git config user.email "bot@example.com"
          git add README.md username.txt
          git commit -m "update ranking" || echo "no changes"
          git push
